<title>Dragon Coin</title>
<style>
/* Layout: phone-first Telegram mini app. Fixed top balance bar, scrolling content, fixed bottom tab bar. Deliberately dark, single theme. */
:root{
  --bg:#0a1f13; --surface:#10281a; --surface2:#17382a; --line:#255038;
  --fg:#f4efd9; --muted:#9bb8a2;
  --gold:#f5b53d; --gold-deep:#b97a14; --ember:#d9482e; --gem:#4fd1e8;
  --good:#6fd08c; --bad:#ff6b6b; --ink:#2a1500;
  --f-display:'Unbounded','Trebuchet MS',sans-serif;
  --f-body:'Onest','Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;overflow:hidden;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(60% 40% at 50% 38%,rgba(245,181,61,.10),transparent 70%)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#app{position:relative;height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column}
.bar{display:flex;gap:10px;padding:12px 16px 8px;align-items:center}
.bal{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 14px 6px 8px;font-family:var(--f-display);font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.bal svg{width:22px;height:22px;flex:none}
.bar .who{margin-left:auto;color:var(--muted);font-size:12px;text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{flex:1;min-height:0;overflow-y:auto;padding:8px 16px 24px}
h2{font-family:var(--f-display);font-size:18px;font-weight:700;margin:6px 0 14px;letter-spacing:.01em;text-wrap:balance}
h3{font-size:15px;margin:0}
.muted{color:var(--muted);font-size:13px}
nav{display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--muted);font-size:11px;border-radius:12px}
nav button svg{width:22px;height:22px}
nav button[aria-current="true"]{color:var(--gold)}
nav button[aria-current="true"] svg{filter:drop-shadow(0 0 6px rgba(245,181,61,.6))}

/* tap screen */
.tap{display:flex;flex-direction:column;align-items:center;gap:18px;padding-top:6px}
.score{font-family:var(--f-display);font-size:44px;font-weight:800;display:flex;align-items:center;gap:10px;font-variant-numeric:tabular-nums}
.score svg{width:40px;height:40px}
.coinbtn{position:relative;background:none;border:0;padding:0;width:min(72vw,300px);aspect-ratio:1;border-radius:50%;touch-action:manipulation;user-select:none;-webkit-user-select:none;filter:drop-shadow(0 12px 40px rgba(245,181,61,.40));transition:transform .08s}
.coinbtn.hit{transform:scale(.94)}
.coinbtn svg{width:100%;height:100%;display:block;pointer-events:none}
.coinbtn img{width:100%;height:100%;display:block;border-radius:50%;object-fit:cover;pointer-events:none;border:4px solid var(--gold);box-shadow:inset 0 0 24px rgba(0,0,0,.45)}
.coinbtn[disabled]{filter:grayscale(.85) brightness(.6);cursor:not-allowed}
.float{position:fixed;pointer-events:none;font-family:var(--f-display);font-weight:800;font-size:24px;color:var(--gold);text-shadow:0 2px 8px rgba(0,0,0,.7);animation:fl .8s ease-out forwards;z-index:30}
@keyframes fl{to{transform:translateY(-70px);opacity:0}}
.limit{width:100%}
.limit .row{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:6px;font-variant-numeric:tabular-nums}
.track{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden;border:1px solid var(--line)}
.fill{height:100%;background:linear-gradient(90deg,var(--ember),var(--gold));border-radius:99px;transition:width .15s}

/* controls */
.btn{border:0;border-radius:14px;padding:11px 16px;font-weight:700;background:linear-gradient(180deg,var(--gold),var(--gold-deep));color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;font-size:14px}
.btn svg{width:18px;height:18px}
.btn.gem{background:linear-gradient(180deg,#7fe3f4,#2b9db5)}
.btn.ghost{background:var(--surface2);color:var(--fg);border:1px solid var(--line)}
.btn.danger{background:#4a1d1d;color:#ffb4b4;border:1px solid #6b2a2a}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.block{width:100%}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;margin-bottom:12px;min-width:0}
.list{display:flex;flex-direction:column}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.pill.live{color:var(--good);border-color:#2f5a3b}
.pill.end{color:var(--muted)}
.pill svg{width:14px;height:14px}
.reward{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-family:var(--f-display);font-size:13px}
.reward svg{width:18px;height:18px}

/* auction */
.art{width:100%;aspect-ratio:16/10;border-radius:12px;object-fit:cover;background:var(--surface2);display:block}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.bidrow{display:flex;gap:8px}
.bidrow input{flex:1;min-width:0}

/* task */
.task{flex-direction:row;align-items:center;gap:12px}
.bst{width:100%;text-align:left;color:inherit;cursor:pointer}
.task .ic{width:42px;height:42px;border-radius:12px;background:var(--surface2);display:grid;place-items:center;flex:none;color:var(--ember)}
.task .ic svg{width:22px;height:22px}
.task .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.task .body h3{overflow-wrap:anywhere}
.done{color:var(--good);font-weight:700;font-size:13px}

/* inputs */
label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;color:var(--fg);width:100%;min-width:0}
input[type=file]{padding:9px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form{display:flex;flex-direction:column;gap:12px}
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(72px,1fr));gap:6px;margin-bottom:14px}
.seg button{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 4px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface2);color:var(--gold);border-color:var(--gold-deep)}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{display:block;font-family:var(--f-display);font-size:18px;font-variant-numeric:tabular-nums}
.avatar{width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--gold),var(--ember));display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:26px;color:var(--ink);flex:none}
.prof{display:flex;gap:14px;align-items:center;margin-bottom:16px}
.empty{text-align:center;color:var(--muted);padding:28px 8px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--surface2);border:1px solid var(--gold-deep);color:var(--fg);padding:10px 16px;border-radius:14px;font-weight:600;font-size:14px;z-index:50;max-width:90vw;text-align:center;animation:tin .2s}
@keyframes tin{from{opacity:0;transform:translate(-50%,8px)}}
.err{color:var(--bad);font-size:13px;min-height:1.2em}
.prev{max-height:120px;border-radius:10px;object-fit:cover}
.rank{width:100%;display:flex;flex-direction:column;gap:6px}
.rank b{font-family:var(--f-display);font-size:13px;color:var(--gold)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.day{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:7px 2px;text-align:center;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.day b{font-family:var(--f-display);font-size:11px;color:var(--fg)}
.day.on{border-color:var(--gold-deep);background:#2e1f0e}.day.on b{color:var(--gold)}
.day.next{outline:1px solid var(--ember)}
.day .mini svg{width:13px;height:13px}
.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.sum div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center;font-size:11px;color:var(--muted);min-width:0}
.sum b{display:block;font-family:var(--f-display);font-size:13px;color:var(--fg);overflow:hidden;text-overflow:ellipsis}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none}
#bg svg{width:100%;height:100%;display:block}
#app{z-index:1}
.fire{position:fixed;width:0;height:0;pointer-events:none;z-index:60}
.fire .fl{position:absolute;left:-14px;top:-34px;width:28px;height:40px;transform-origin:50% 100%;animation:flame .6s ease-out forwards;filter:drop-shadow(0 0 8px #ff8a1f)}
.fire .fl svg{width:100%;height:100%;display:block}
.fire.sm .fl{width:18px;height:26px;left:-9px;top:-22px}
.fire i{position:absolute;left:-3px;top:-3px;width:6px;height:6px;border-radius:50%;background:radial-gradient(circle,#fff6b0,#ff8a1f 60%,transparent);animation:spark .65s ease-out forwards;animation-delay:calc(var(--d)*1ms)}
@keyframes flame{0%{transform:scale(.2);opacity:1}40%{transform:scale(1.05,1.2);opacity:1}100%{transform:scale(.6,1.5) translateY(-18px);opacity:0}}
@keyframes spark{to{transform:translate(var(--x),var(--y)) scale(.3);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

/* ---------- Holat ---------- */
const today = () => { const d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); };
function art(seed){
  let h=0; for(const c of String(seed)) h=(h*31+c.charCodeAt(0))>>>0;
  const a=h%360, b=(a+40+(h>>3)%60)%360;
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="hsl(${a} 70% 38%)"/><stop offset="1" stop-color="hsl(${b} 75% 18%)"/></linearGradient></defs><rect width="320" height="200" fill="url(#g)"/><circle cx="${80+h%160}" cy="${60+h%70}" r="${40+h%30}" fill="hsl(${b} 80% 60% / .35)"/><path d="M0 200L90 ${110+h%40} 170 170 250 ${90+h%30} 320 160V200z" fill="hsl(${a} 60% 10% / .55)"/></svg>`;
  return 'data:image/svg+xml;utf8,'+encodeURIComponent(svg);
}
function defaults(){
  const now=Date.now();
  return {
    u:{coins:0,gems:5,used:0,day:today(),level:1,done:{},started:{},taps:0,joined:now},
    auctions:[
      {id:'a1',name:'Oltin ajdaho tuxumi',img:art('Oltin ajdaho tuxumi'),endsAt:now+26*3600e3,start:200,bid:0,bidder:null},
      {id:'a2',name:'Olov qanoti NFT',img:art('Olov qanoti'),endsAt:now+5*3600e3,start:500,bid:650,bidder:'Sardor'}
    ],
    tasks:[
      {id:'t1',type:'channel',title:'Dragon Promo kanaliga obuna bo‘ling',link:'https://t.me/'+CHANNEL,amount:500,cur:'coin'},
      {id:'t2',type:'bot',title:'Hamkor botga /start bosing',link:'https://t.me/BotFather',amount:3,cur:'gem'},
      {id:'t3',type:'bot',title:'Xamster botiga start bosing',link:'https://t.me/Xamster_uzb_bot',amount:150,cur:'coin'}
    ]
  };
}
let S;
function load(){
  try{ const r=localStorage.getItem(KEY); if(r){ const o=JSON.parse(r); if(o&&o.u) return o; } }catch(e){}
  return defaults();
}
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }
S=load();
function fix(){
  S.set=S.set||{haptic:true}; S.cfg=S.cfg||{bot:'dragon_coin_bot'};
  S.promos=S.promos||[{code:'DRAGON500',amount:500,cur:'coin'}]; S.u.promoDone=S.u.promoDone||{}; S.u.bids=S.u.bids||{}; S.u.settled=S.u.settled||{};
  if(S.set.sound===undefined) S.set.sound=true;
  const t3=S.tasks.find(t=>t.id==='t3');
  if(t3&&t3.link==='https://telegram.org'){ t3.type='bot'; t3.title='Xamster botiga start bosing'; t3.link='https://t.me/Xamster_uzb_bot'; }
  const t1=S.tasks.find(t=>t.id==='t1');
  if(t1&&t1.link==='https://t.me/telegram'){ t1.link='https://t.me/'+CHANNEL; t1.title='Dragon Promo kanaliga obuna bo‘ling'; }
}
fix();
function rollDay(){ if(S.u.day!==today()){ S.u.day=today(); S.u.used=0; save(); } }
const lvl = () => Math.min(LEVELS.length, Math.max(1, S.u.level||1));
const limit = () => LEVELS[lvl()-1].cap;
const mult = () => LEVELS[lvl()-1].m;
const fmt = (n) => Math.floor(n).toLocaleString('en').replace(/,/g,' ');
const esc = (s) => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2,9);
const userName = () => (tgUser && (tgUser.first_name||tgUser.username)) || 'Sinov foydalanuvchi';

function countdown(ms){
  if(ms<=0) return 'Tugadi';
  const s=Math.floor(ms/1000), d=Math.floor(s/86400), h=Math.floor(s%86400/3600), m=Math.floor(s%3600/60), x=s%60;
  const p=(n)=>String(n).padStart(2,'0');
  return (d?d+' kun ':'')+p(h)+':'+p(m)+':'+p(x);
}

/* ---------- UI yordamchilari ---------- */
let toastT;
function toast(msg){
  document.querySelectorAll('.toast').forEach(e=>e.remove());
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg; t.setAttribute('role','status');
  document.body.appendChild(t); clearTimeout(toastT); toastT=setTimeout(()=>t.remove(),2200);
}
function updateBar(){
  document.getElementById('b-coins').textContent=fmt(S.u.coins);
  document.getElementById('b-gems').textContent=fmt(S.u.gems);
}

/* ---------- Darajalar va kunlik bonus ---------- */
const DAILY=[{c:100},{c:200},{c:300},{c:500},{c:800},{c:1200},{g:10}];
function yest(){ const d=new Date(); d.setDate(d.getDate()-1); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function dailyHTML(){
  const u=S.u, claimed=u.lastDaily===today(), valid=u.lastDaily===yest(), st=u.streak||0;
  const pos = claimed ? ((st-1)%7)+1 : (valid ? st%7 : 0);
  const cell=(r,i)=>`<div class="day ${i<pos?'on':''} ${(!claimed&&i===pos)?'next':''}"><span>${i+1}-kun</span><b>${r.g?`<span class="mini" data-i="gem"></span>${r.g}`:'+'+r.c}</b></div>`;
  return `<div class="card"><div class="between"><h3>Kunlik bonus</h3><span class="pill">Ketma-ket: ${valid||claimed?st:0} kun</span></div>
    <div class="days">${DAILY.map(cell).join('')}</div>
    <button class="btn block" data-act="daily" ${claimed?'disabled':''}>${claimed?'Bugun olindi, ertaga qaytib keling':'Bonusni olish'}</button></div>`;
}
function claimDaily(){
  const u=S.u; if(u.lastDaily===today()) return;
  const ns=(u.lastDaily===yest()?(u.streak||0):0)+1, r=DAILY[(ns-1)%7];
  u.streak=ns; u.lastDaily=today();
  if(r.c) u.coins+=r.c; if(r.g) u.gems+=r.g;
  save(); haptic('medium'); toast(r.g?'+'+r.g+' olmos':'+'+fmt(r.c)+' coin'); render();
}

  nav.innerHTML=TABS.map(([k,l,i])=>`<button data-tab="${k}" aria-current="${tab===k}">${ico(i)}<span>${l}</span></button>`).join('');
}
function go(t){ tab=t; renderNav(); render(); view.scrollTop=0; }
nav.addEventListener('click',e=>{ const b=e.target.closest('[data-tab]'); if(b) go(b.dataset.tab); });

  rollDay(); settleLots(); updateBar();
  ({tap:rTap,auction:rAuction,tasks:rTasks,boost:rBoost,profile:rProfile,shop:rShop})[tab]();
  hydrateIcons(view);
  if(tab==='profile') fillPromos();
  if(tab==='auction'||tab==='tasks') syncDown();
  tick();

function rTap(){
  const L=limit(), left=Math.max(0,L-S.u.used);
  view.innerHTML=`<div class="tap">
    <div class="score"><span data-i="coin"></span><span id="t-score">${fmt(S.u.coins)}</span></div>
    <button class="coinbtn" id="coin" aria-label="Tangani bosing" ${left<=0?'disabled':''}><img src="${DRAGON_IMG}" alt="" draggable="false"></button>
    <button class="btn ghost block" data-act="goShop">Do‘kon &middot; ${lvl()}-daraja &middot; ${mult()}x tap</button>
    <div class="limit">
      <div class="row"><span>Energiya</span><span id="t-lim">${fmt(left)} / ${fmt(L)}</span></div>
      <div class="track"><div class="fill" id="t-fill" style="width:${Math.min(100,left/L*100)}%"></div></div>
      <div class="muted" style="margin-top:6px">Har bosishda +${mult()} coin. Kunlik limit: ${fmt(L)} coin. Energiya har kuni to‘lib boshlanadi.</div>
    </div>
    <button class="btn gem block" id="restore" data-act="restore" ${S.u.used<=0?'disabled':''}><span data-i="gem"></span>Energiyani tiklash &middot; ${RESTORE_COST} olmos</button>
  </div>`;
  const c=document.getElementById('coin');
  c.addEventListener('pointerdown',onTap);
}
function onTap(e){
  rollDay();
  if(S.u.used>=limit()){ toast('Energiya tugadi. Olmos bilan tiklang.'); return; }
  e.preventDefault();
  const gain=Math.min(mult(),limit()-S.u.used); S.u.used+=gain; S.u.coins+=gain; S.u.taps++;
  save(); haptic('light');
  const c=document.getElementById('coin');
  c.classList.add('hit'); setTimeout(()=>c.classList.remove('hit'),70);
  const f=document.createElement('div'); f.className='float'; f.textContent='+'+gain;
  f.style.left=(e.clientX-12)+'px'; f.style.top=(e.clientY-30)+'px';
  document.body.appendChild(f); setTimeout(()=>f.remove(),800);
  const L=limit();
  document.getElementById('t-score').textContent=fmt(S.u.coins);
  document.getElementById('t-lim').textContent=fmt(L-S.u.used)+' / '+fmt(L);
  document.getElementById('t-fill').style.width=Math.min(100,(L-S.u.used)/L*100)+'%';
  document.getElementById('restore').disabled=false;
  if(S.u.used>=L) c.disabled=true;
  updateBar();
}

const myId = () => tgUser ? String(tgUser.id) : 'local';
const isMine = (a) => !!a.sellerId && String(a.sellerId)===myId();
let lotOpen=false;
function lotCard(){
  if(!lotOpen) return `<button class="btn ghost block" data-act="lotToggle" style="margin-bottom:12px">O‘z lotimni qo‘yish</button>`;
  return `<form class="card form" id="lot-form"><div class="between"><h3>Yangi lot</h3><button type="button" class="btn ghost" data-act="lotToggle">Yopish</button></div>
    <label for="l-name">Nomi<input id="l-name" maxlength="60" required placeholder="Masalan: PUBG akkaunt"></label>
    <div class="grid2">
      <label for="l-hours">Muddat<select id="l-hours"><option value="1">1 soat</option><option value="6">6 soat</option><option value="24" selected>1 kun</option><option value="72">3 kun</option><option value="168">7 kun</option></select></label>
      <label for="l-start">Boshlang‘ich narx<input id="l-start" type="number" inputmode="numeric" min="1" value="100" required></label>
    </div>
    <div class="muted">Lot sotilsa, yetakchi taklif miqdori coin bo‘lib sizga o‘tadi. Bir vaqtda 3 tagacha lot qo‘ya olasiz.</div>
    <div class="err" id="l-err"></div><button class="btn block" type="submit">Lotni qo‘yish</button></form>`;
}
async function createLot(){
  const err=document.getElementById('l-err');
  const name=document.getElementById('l-name').value.trim(), hours=Number(document.getElementById('l-hours').value), start=Math.floor(Number(document.getElementById('l-start').value));
  if(!name){ err.textContent='Nom kiriting'; return; }
  if(!(start>=1&&start<=1e9)){ err.textContent='Narx 1 dan 1 000 000 000 gacha bo‘lsin'; return; }
  const active=S.auctions.filter(a=>isMine(a)&&a.endsAt>Date.now()).length;
  if(active>=3){ err.textContent='Bir vaqtda 3 tadan ko‘p lot qo‘ya olmaysiz'; return; }

async function placeBid(id){
  const a=S.auctions.find(x=>x.id===id); if(!a) return;
  if(isMine(a)){ toast('O‘z lotingizga taklif bera olmaysiz'); return; }
  if(a.endsAt<=Date.now()){ toast('Auksion tugagan'); render(); return; }
  const v=Math.floor(Number(document.getElementById('bid-'+id).value));
  const nx=minNext(a);
  if(!(v>=nx)){ toast('Eng kam taklif: '+fmt(nx)+' coin'); return; }
  const refund = a.bidder==='me' ? a.bid : 0;
  if(S.u.coins+refund<v){ toast('Coin yetarli emas'); return; }

    try{ const r=await api('/api/bid',{id,amount:v,initData:initData()}); if(!r.ok){ toast(r.error||'Taklif qabul qilinmadi'); await syncDown(true); return; } }
    catch(e){ toast('Server bilan aloqa yo‘q'); return; }
    S.u.bids[id]=v;
  }
  S.u.coins+=refund-v; a.bid=v; a.bidder='me'; save(); haptic('medium');

/* ---------- Server bilan almashinuv (vazifa va auksionlar hamma uchun umumiy) ---------- */
let lastSync=0;
async function syncDown(force){
  if(!API_URL) return;
  if(!force && Date.now()-lastSync<4000) return;
  lastSync=Date.now();
  try{
    const r=await api('/api/content'), me=tgUser?String(tgUser.id):'';
    const auctions=(r.auctions||[]).map(a=>({id:a.id,name:a.name,img:a.img,endsAt:a.endsAt,start:a.start,bid:a.bid||0,bidder:a.bidderId?(String(a.bidderId)===me?'me':a.bidder):null,sellerId:a.sellerId||null,seller:a.seller||null}));
    const before=JSON.stringify([S.tasks,S.auctions,S.u.coins]);
    S.tasks=r.tasks||[]; S.auctions=auctions;
    for(const id of Object.keys(S.u.bids)){ const a=auctions.find(x=>x.id===id); if(!a||a.bidder!=='me'){ S.u.coins+=S.u.bids[id]; delete S.u.bids[id]; } }
    if(JSON.stringify([S.tasks,S.auctions,S.u.coins])!==before){
      save();
      const f=document.activeElement;
      if(tab==='auction'&&f&&f.tagName==='INPUT') updateBar(); else render();
    }
  }catch(e){}
}
async function pushContent(removed){
  if(!API_URL) return;
  try{
    const r=await api('/api/admin/content',{initData:initData(),tasks:S.tasks,auctions:S.auctions.map(a=>({id:a.id,name:a.name,img:a.img,endsAt:a.endsAt,start:a.start})),removed:removed||[]});
    if(!r.ok) toast(r.error||'Serverga saqlanmadi'); else lastSync=0;
  }catch(e){ toast('Serverga saqlanmadi'); }
}

      <button class="btn block" type="submit">Qo‘shish</button></form>
    <h3 style="margin:16px 0 10px">Mavjud kodlar (${S.promos.length})</h3>
    ${S.promos.map(x=>`<div class="card task"><div class="body"><h3>${esc(x.code)}</h3>${REWARD(x)}</div><button class="btn danger" data-act="delPromo" data-id="${esc(x.code)}">O‘chirish</button></div>`).join('')||'<div class="empty">Bo‘sh</div>'}`}`;
  hydrateIcons(el);
  if(API_URL) return;
  document.getElementById('pf').addEventListener('submit',e=>{
    e.preventDefault();
    const code=document.getElementById('p-code').value.trim().toUpperCase(), amount=Math.floor(Number(document.getElementById('p-amt').value));
    const err=document.getElementById('p-err');
    if(!/^[A-Z0-9_-]{3,32}$/.test(code)){ err.textContent='Kod 3-32 ta harf, raqam, - yoki _ bo‘lsin'; return; }
    if(S.promos.some(x=>x.code===code)){ err.textContent='Bu kod mavjud'; return; }
    if(!(amount>=1)){ err.textContent='Miqdor 1 dan kam bo‘lmasin'; return; }
    S.promos.push({code,amount,cur:document.getElementById('p-cur').value}); save(); toast('Kod qo‘shildi'); render();
  });
}

/* ---------- Hodisalar ---------- */
const confirmArm = {};
view.addEventListener('submit',e=>{ if(e.target.id==='lot-form'){ e.preventDefault(); createLot(); } });
view.addEventListener('click',e=>{
  const at=e.target.closest('[data-atab]'); if(at){ adminTab=at.dataset.atab; render(); return; }
  const b=e.target.closest('[data-act]'); if(!b) return;
  const a=b.dataset.act, id=b.dataset.id;
  // o'chirish va to'liq reset: ikki bosishli tasdiq
  if(a==='cancelLot'){
    const k='cl'+id;
    if(!confirmArm[k]){ confirmArm[k]=1; b.textContent='Aniqmi? Yana bosing'; setTimeout(()=>{ delete confirmArm[k]; if(b.isConnected) b.textContent='Lotni bekor qilish'; },3000); return; }
    delete confirmArm[k]; cancelLot(id); return;
  }
  if(a==='delAuction'||a==='delTask'||a==='delPromo'||a==='resetAll'){
    const k=a+id;
    if(!confirmArm[k]){ confirmArm[k]=1; b.textContent='Aniqmi? Yana bosing'; setTimeout(()=>{ delete confirmArm[k]; if(b.isConnected) b.textContent=a==='resetAll'?'Hamma ma‘lumotni boshiga qaytarish':'O‘chirish'; },3000); return; }
    delete confirmArm[k];
    if(a==='delAuction') S.auctions=S.auctions.filter(x=>x.id!==id);
    if(a==='delTask') S.tasks=S.tasks.filter(x=>x.id!==id);
    if(a==='delPromo') S.promos=S.promos.filter(x=>x.code!==id);
    if(a==='resetAll'){ S=defaults(); fix(); }
    save(); if(a==='delAuction'||a==='delTask') pushContent(a==='delAuction'?[id]:[]); render(); return;
  }
  if(a==='restore') restore();
  else if(a==='bid') placeBid(id);
  else if(a==='daily') claimDaily();
  else if(a==='lotToggle'){ lotOpen=!lotOpen; render(); }
  else if(a==='redeem') redeem(b.dataset.code||(document.getElementById('promo-in')||{}).value);
  else if(a==='toggleHaptic'){ S.set.haptic=!S.set.haptic; save(); render(); }
  else if(a==='copyRef'){ const i=document.getElementById('ref'); const fb=()=>{ i.select(); toast('Havolani belgilab nusxalang'); };
    try{ navigator.clipboard.writeText(i.value).then(()=>toast('Nusxalandi'),fb); }catch(err){ fb(); } }
  else if(a==='start') startTask(id);
  else if(a==='claim') claimTask(id);
  else if(a==='goShop') go('shop');
  else if(a==='goTap') go('tap');
  else if(a==='soon') toast('Hozircha qo‘shilmagan');
  else if(a==='buyLevel'){ const n=Number(id), x=LEVELS[n-1]; if(!x||n!==lvl()+1) return;
    if(S.u.gems<x.p) return toast('Olmos yetarli emas'); S.u.gems-=x.p; S.u.level=n; save(); haptic('heavy'); toast(n+'-daraja ochildi'); render(); }
  else if(a==='adminIn'){ if(isAdmin()){ adminOK=true; render(); } }
  else if(a==='toggleSound'){ S.set.sound=!S.set.sound; save(); render(); }
  else if(a==='adminOut'){ adminOK=false; render(); }
});

/* Har soniyada: taymerlar, kunlik reset, vazifa tugmasi */
let lastEnded = -1;
function tick(){
  const now=Date.now(); let ended=0;
  document.querySelectorAll('[data-end]').forEach(el=>{ const t=+el.dataset.end; el.textContent=countdown(t-now); if(t<=now) ended++; });
  if(tab==='auction'){ const changed=lastEnded!==-1 && ended!==lastEnded; lastEnded=ended; if(changed){ const f=document.activeElement; if(!(f&&f.tagName==='INPUT')) render(); } } else lastEnded=-1;
}
setInterval(()=>{ if(API_URL&&tab==='auction') syncDown(); if(S.u.day!==today()){ rollDay(); if(tab==='tap') render(); } tick(); },1000);

/* ---------- Fon: bambuk, ajdaho, xitoy bezaklari ---------- */
function buildBg(){
  const W=480,H=900; let seed=11; const rnd=()=>{ seed=(seed*16807)%2147483647; return (seed-1)/2147483646; };
  let o=`<defs><linearGradient id="bgg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#11301f"/><stop offset=".6" stop-color="#0a1f13"/><stop offset="1" stop-color="#06140c"/></linearGradient>
    <radialGradient id="sun"><stop offset="0" stop-color="#e2553a" stop-opacity=".5"/><stop offset="1" stop-color="#e2553a" stop-opacity="0"/></radialGradient></defs>
    <rect width="${W}" height="${H}" fill="url(#bgg)"/>
    <circle cx="340" cy="190" r="170" fill="url(#sun)"/><circle cx="340" cy="190" r="64" fill="#c8402a" opacity=".32"/>`;
  const cloud=(x,y,k)=>`<g transform="translate(${x} ${y}) scale(${k})" fill="none" stroke="#f5b53d" stroke-width="1.6" opacity=".2" stroke-linecap="round"><path d="M0 34C10 34 12 20 26 20C30 6 50 6 54 20C68 18 74 34 60 36Z"/><path d="M20 34c-6-2-6-10 0-10s8 6 3 9"/><path d="M44 34c-6-2-6-10 0-10s8 6 3 9"/></g>`;
  o+=cloud(30,300,1.3)+cloud(300,520,1.5)+cloud(90,700,1.1)+cloud(330,80,.9);
  /* ajdaho (chiziqli siluet) */
  o+=`<g fill="none" stroke="#f5b53d" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-20 790C110 740 130 600 240 620S400 560 340 440S190 380 262 270" stroke-width="22" opacity=".09"/>
    <path d="M-20 790C110 740 130 600 240 620S400 560 340 440S190 380 262 270" stroke-width="18" stroke-dasharray="2 11" opacity=".22"/>
    <path d="M262 270c18-34 56-38 84-22 14 8 22 20 30 22-12 0-20 4-24 10 12 6 18 16 20 26-24-12-46-8-60-2-18 8-40 4-50-34Z" stroke-width="2.4" opacity=".3" fill="#f5b53d" fill-opacity=".07"/>
    <path d="M300 238c-6-26-22-40-40-46M318 236c2-24 14-40 30-52" stroke-width="2.4" opacity=".3"/>
    <path d="M372 274c22 4 34 18 40 36M372 284c20 8 28 24 28 44" stroke-width="2" opacity=".26"/>
    <circle cx="330" cy="254" r="3" fill="#f5b53d" opacity=".5" stroke="none"/></g>`;
  const stalk=(x,w,fill,node,op,leaf)=>{
    let t=`<g opacity="${op}"><rect x="${x}" y="0" width="${w}" height="${H}" fill="${fill}"/><rect x="${x}" y="0" width="${w*.28}" height="${H}" fill="#fff" opacity=".07"/>`;
    let y=rnd()*60+20;
    while(y<H){
      t+=`<rect x="${x-w*.12}" y="${y.toFixed(1)}" width="${w*1.24}" height="${(w*.26).toFixed(1)}" rx="${(w*.13).toFixed(1)}" fill="${node}"/>`;
      if(leaf&&rnd()<.75){ const dir=rnd()<.5?-1:1;
        for(let k=0;k<3;k++){ const a=-(18+k*26+rnd()*14).toFixed(0);
          t+=`<path d="M0 0Q24 -10 64 0Q24 10 0 0Z" transform="translate(${(x+w/2).toFixed(1)} ${y.toFixed(1)}) scale(${dir} 1) rotate(${a}) scale(${(.7+rnd()*.5).toFixed(2)})" fill="${leaf}"/>`; } }
      y+=70+rnd()*60; }
    return t+'</g>';
  };
  [30,150,290,418].forEach(x=>{ o+=stalk(x,16,'#1f5233','#0e2b1b',.45,'#1d5a35'); });
  [[2,26],[48,13],[424,28],[392,13]].forEach(([x,w])=>{ o+=stalk(x,w,'#2f7d49','#1a4a2c',.9,'#2f8f52'); });
  const lantern=(x,len)=>`<g><line x1="${x}" y1="0" x2="${x}" y2="${len}" stroke="#f5b53d" stroke-width="1.4" opacity=".6"/><rect x="${x-9}" y="${len}" width="18" height="5" rx="2" fill="#f5b53d" opacity=".85"/><ellipse cx="${x}" cy="${len+32}" rx="22" ry="27" fill="#c8402a"/><ellipse cx="${x}" cy="${len+32}" rx="22" ry="27" fill="none" stroke="#f5b53d" stroke-width="1.4" opacity=".55"/><path d="M${x-8} ${len+8}Q${x-14} ${len+32} ${x-8} ${len+56}M${x+8} ${len+8}Q${x+14} ${len+32} ${x+8} ${len+56}" stroke="#7a1f12" stroke-width="1.4" fill="none"/><rect x="${x-9}" y="${len+57}" width="18" height="5" rx="2" fill="#f5b53d" opacity=".85"/><path d="M${x} ${len+62}v22M${x-5} ${len+62}v16M${x+5} ${len+62}v16" stroke="#f5b53d" stroke-width="1.4" opacity=".7"/></g>`;
  o+=lantern(120,20)+lantern(372,50);
  document.getElementById('bg').innerHTML=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice">${o}</svg>`;
}
buildBg();

/* ---------- Olov animatsiyasi va qilich ovozi ---------- */
const FLAME='<svg viewBox="0 0 28 40"><defs><linearGradient id="flg" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ff4d12"/><stop offset=".55" stop-color="#ff9a1f"/><stop offset="1" stop-color="#ffe27a"/></linearGradient></defs><path d="M14 0C16 10 26 14 26 26a12 12 0 0 1-24 0C2 20 6 16 8 12c1 4 3 6 5 6C11 12 11 6 14 0Z" fill="url(#flg)"/><path d="M14 20c1 5 6 6 6 11a6 6 0 0 1-12 0c0-3 2-5 3-6 0 2 1 3 2 3-1-3-1-5 1-8Z" fill="#fff3b0" opacity=".9"/></svg>';
function fire(x,y,small){
  const f=document.createElement('div'); f.className='fire'+(small?' sm':''); f.style.left=x+'px'; f.style.top=y+'px';
  let h='<span class="fl">'+FLAME+'</span>';
  for(let k=0;k<(small?4:8);k++){ const a=-Math.PI/2+(Math.random()-.5)*2.4, d=16+Math.random()*34; h+=`<i style="--x:${(Math.cos(a)*d).toFixed(1)}px;--y:${(Math.sin(a)*d).toFixed(1)}px;--d:${Math.random()*90|0}"></i>`; }
  f.innerHTML=h; document.body.appendChild(f); setTimeout(()=>f.remove(),850);
}
let AC;
function sword(){
  if(!S.set.sound) return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume();
    const t=AC.currentTime, dur=.38;
    const buf=AC.createBuffer(1,Math.floor(AC.sampleRate*dur),AC.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,1.5);
    const n=AC.createBufferSource(); n.buffer=buf;
    const bp=AC.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=6; bp.frequency.setValueAtTime(1800,t); bp.frequency.exponentialRampToValueAtTime(9000,t+.22);
    const g=AC.createGain(); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.5,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    n.connect(bp); bp.connect(g); g.connect(AC.destination); n.start(t);
    [3150,4730,6280].forEach((f,i)=>{ const o=AC.createOscillator(); o.type='sine'; o.frequency.value=f;
      const og=AC.createGain(); og.gain.setValueAtTime(.0001,t+.03); og.gain.exponentialRampToValueAtTime(.07/(i+1),t+.05); og.gain.exponentialRampToValueAtTime(.0001,t+.5);
      o.connect(og); og.connect(AC.destination); o.start(t+.03); o.stop(t+.55); });
  }catch(e){}
}
document.addEventListener('pointerdown',e=>{
  const b=e.target.closest&&e.target.closest('button,a.btn'); if(!b||b.disabled) return;
  const coin=b.id==='coin';
  fire(e.clientX,e.clientY,coin);
  if(!coin) sword();
},true);

hydrateIcons();
renderNav();
render();
if(API_URL){ syncDown(true); api('/api/me',{initData:initData()}).then(r=>{ serverAdmin=!!r.admin; if(tab==='profile') render(); }).catch(()=>{}); }
